[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "macroseg"
version = "0.0.1"
description = "Fine-tuning Cellpose to segment macrophages in MACSIMA data"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pyyaml>=6",
]

[project.optional-dependencies]
# Imaging stack. Kept optional so the config and pure-numpy parts install anywhere.
imaging = [
  "cellpose>=4",
  "harpy-analysis>=0.5",
  "pylibczirw>=6.1.0",
  "spatialdata>=0.8",
]
# Annotation UI (napari + spatiato), to test the annotation workflow locally.
viewer = [
  "spatiato>=0.2.1",
]
dev = [
  "ipykernel>=6.31.0",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = [ "src/macroseg" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.ruff]
line-length = 120
src = [ "src", "tests" ]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B" ]
